spring.application.name=demo
spring.config.import=optional:file:.env[.properties]

# DATASOURCE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_HOST_PORT:3306}/${MYSQL_DATABASE:demo40}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:appuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:apppassword}}

# JPA / HIBERNATE
# Hibernate automatically determines the appropriate MySQL dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# DEVTOOLS
spring.devtools.livereload.enabled=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE
